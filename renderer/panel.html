<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Recording</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  body{background:transparent;font:13px "Inter","Segoe UI",system-ui,sans-serif;color:#f1f3f9;overflow:hidden;-webkit-font-smoothing:antialiased}
  .bar{
    -webkit-app-region:drag;
    display:flex;align-items:center;gap:10px;height:56px;margin:6px;padding:0 8px 0 14px;
    background:rgba(27,28,34,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,.1);border-radius:28px;
    box-shadow:0 16px 40px rgba(0,0,0,.6);
  }
  .dot{width:11px;height:11px;border-radius:50%;background:#f87171;animation:b 1.1s infinite;flex:0 0 11px;box-shadow:0 0 8px rgba(248,113,113,.5)}
  .dot.paused{background:#fbbf24;animation:none;box-shadow:0 0 8px rgba(251,191,36,.5)}
  @keyframes b{50%{opacity:.3}}
  .time{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;min-width:74px;letter-spacing:-.01em}
  .spacer{flex:1}
  button{
    -webkit-app-region:no-drag;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#f1f3f9;border-radius:20px;
    padding:7px 14px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s ease;
  }
  button:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22)}
  button.stop{background:linear-gradient(135deg,#ef4444,#dc2626);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 2px 10px rgba(239,68,68,.4)}
  button.stop:hover{background:linear-gradient(135deg,#f87171,#ef4444);box-shadow:0 4px 14px rgba(239,68,68,.5)}
</style>
</head>
<body>
  <div class="bar">
    <div class="dot" id="dot"></div>
    <div class="time" id="time">00:00:00</div>
    <div class="spacer"></div>
    <button id="cam" hidden>Hide cam</button>
    <button id="pause">Pause</button>
    <button class="stop" id="stop">Stop</button>
  </div>
<script src="panel.js"></script>
</body>
</html>

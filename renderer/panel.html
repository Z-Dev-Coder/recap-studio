<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Recording</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  body{background:transparent;font:13px "Segoe UI",system-ui,sans-serif;color:#e8ecf4;overflow:hidden}
  .bar{
    -webkit-app-region:drag;
    display:flex;align-items:center;gap:10px;height:56px;margin:6px;padding:0 8px 0 14px;
    background:rgba(22,26,34,.96);border:1px solid #2b3444;border-radius:28px;
    box-shadow:0 12px 34px rgba(0,0,0,.55);
  }
  .dot{width:11px;height:11px;border-radius:50%;background:#ff4d5e;animation:b 1.1s infinite;flex:0 0 11px}
  .dot.paused{background:#ffb020;animation:none}
  @keyframes b{50%{opacity:.3}}
  .time{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;min-width:74px}
  .spacer{flex:1}
  button{
    -webkit-app-region:no-drag;
    background:#242c3a;border:1px solid #333c4d;color:#e8ecf4;border-radius:20px;
    padding:8px 14px;font:inherit;font-size:12px;cursor:pointer;transition:.15s;
  }
  button:hover{background:#2e3849}
  button.stop{background:#ff4d5e;border-color:#ff4d5e;color:#fff;font-weight:600}
  button.stop:hover{background:#ff6472}
</style>
</head>
<body>
  <div class="bar">
    <div class="dot" id="dot"></div>
    <div class="time" id="time">00:00:00</div>
    <div class="spacer"></div>
    <button id="cam" hidden>Hide cam</button>
    <button id="pause">Pause</button>
    <button class="stop" id="stop">Stop</button>
  </div>
<script src="panel.js"></script>
</body>
</html>

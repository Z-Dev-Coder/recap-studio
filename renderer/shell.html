<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: file:; media-src 'self' blob: file:;
               font-src 'self' data: https://fonts.gstatic.com;
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self';
               frame-src 'self' file: http://127.0.0.1:* http://localhost:*" />
<title>Toolbox — AI &amp; Media Suite</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="shell.css" />
</head>
<body>
<div class="app">

  <aside class="sidebar" role="navigation" aria-label="Main Navigation">
    <div class="brand">
      <div class="brand-dot" aria-hidden="true"></div>
      <div class="brand-info">
        <div class="brand-name">Toolbox</div>
        <div class="brand-sub">AI &amp; Media Suite</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard" aria-label="Dashboard">
        <span class="ic" aria-hidden="true">
          <svg class="svg-ic ic-18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        </span>
        <span class="lbl">Dashboard</span>
      </button>
      <div class="section-label" role="presentation">TOOLS</div>
      <div id="navModules"></div>
    </nav>

    <div class="side-foot">
      <div id="svcDots" role="status" aria-label="Services Status"></div>
      <div class="ver" id="ver"></div>
    </div>
  </aside>

  <main class="shell-main" role="main">

    <!-- ============ dashboard ============ -->
    <section class="view active" id="view-dashboard" aria-label="Dashboard Overview">
      <header class="page-head">
        <h1 id="greeting">Welcome back</h1>
        <p class="muted">Pick a tool, or jump straight back into something recent.</p>
      </header>

      <!-- Bento Grid Tool Cards -->
      <div class="dashboard-grid" id="toolGrid" role="region" aria-label="Tool Bento Grid"></div>

      <!-- Recent Activity Section -->
      <div class="dash-cols">
        <div class="card grow" role="region" aria-label="Recent Recordings">
          <div class="card-head">
            <h3>Recent recordings</h3>
            <button class="ghost small" data-folder="recordings" aria-label="Open recordings folder">Open folder</button>
          </div>
          <div class="recent" id="recentRecordings" role="feed"></div>
        </div>
        <div class="card grow" role="region" aria-label="Recent Downloads">
          <div class="card-head">
            <h3>Recent downloads</h3>
            <button class="ghost small" data-folder="downloads" aria-label="Open downloads folder">Open folder</button>
          </div>
          <div class="recent" id="recentDownloads" role="feed"></div>
        </div>
      </div>
    </section>

    <!-- ============ module host ============ -->
    <section class="view" id="view-module" aria-label="Active Tool Workspace">
      <div class="module-bar">
        <button class="ghost small" id="backHome" aria-label="Return to Dashboard">
          <svg class="svg-ic ic-14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          Dashboard
        </button>
        <h2 class="module-title" id="moduleTitle" tabindex="-1"></h2>
        <span class="module-state" id="moduleState"></span>
        <span class="spacer"></span>
        <button class="ghost small" id="moduleReload" aria-label="Reload current tool">Reload</button>
      </div>
      <div class="module-host">
        <div class="loader hidden" id="moduleLoader">
          <div class="spin" aria-hidden="true"></div>
          <span id="loaderText">Starting...</span>
        </div>
        <div class="module-error hidden" id="moduleError" role="alert"></div>
        <!-- "camera *" not "camera": a bare feature name delegates to 'src', and a
             file:// module frame has an opaque origin that 'src' never matches, so the
             recorder would be refused the mic and camera before Electron is asked. -->
        <iframe id="moduleFrame"
                allow="camera *; microphone *; display-capture *; autoplay *; clipboard-write *; clipboard-read *"
                src="about:blank"
                title="Active Tool Workspace Frame"></iframe>
      </div>
    </section>

  </main>
</div>
<script src="shell.js"></script>
</body>
</html>

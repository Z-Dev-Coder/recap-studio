<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Select area</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;cursor:crosshair;user-select:none;
    font:13px "Segoe UI",system-ui,sans-serif;background:rgba(10,12,16,.35)}
  #sel{position:absolute;border:2px solid #ff4d5e;background:rgba(255,77,94,.09);display:none;
    box-shadow:0 0 0 100000px rgba(10,12,16,.45)}
  #size{position:absolute;display:none;background:#ff4d5e;color:#fff;font-weight:600;
    padding:3px 9px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap;
    transform:translateY(-30px)}
  #hint{position:absolute;top:26px;left:50%;transform:translateX(-50%);
    background:rgba(20,24,32,.92);color:#e8ecf4;padding:10px 20px;border-radius:30px;
    border:1px solid #333c4d;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #hint b{background:#2b3444;border-radius:5px;padding:1px 6px;margin:0 3px}
</style>
</head>
<body>
  <div id="hint">Drag to select an area &nbsp;·&nbsp; <b>Esc</b> cancel &nbsp;·&nbsp; <b>Enter</b> full screen</div>
  <div id="sel"></div>
  <div id="size"></div>
<script src="overlay.js"></script>
</body>
</html>

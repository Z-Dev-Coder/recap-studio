<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Downloader</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #f8f9fb;
    --text: #14161a;
    --muted: #656c7a;
    --faint: #939aa8;
    --line: #e4e7ec;
    --accent: #2f6bff;
    --accent-hi: #1b53e0;
    --accent-soft: #eaf0ff;
    --ok: #0f8a4d;
    --ok-soft: #e6f6ed;
    --err: #d0342c;
    --err-soft: #fdeceb;
    --warn: #a8620a;
    --warn-soft: #fdf1e0;
    --shadow: 0 1px 2px rgba(18,22,31,.05), 0 8px 24px -12px rgba(18,22,31,.14);
    --shadow-lg: 0 2px 4px rgba(18,22,31,.06), 0 24px 48px -20px rgba(18,22,31,.28);
    --r: 14px;
    --r-sm: 9px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --surface: #171a20;
      --surface-2: #1e222a;
      --text: #e9ecf1;
      --muted: #9ba3b2;
      --faint: #6f7787;
      --line: #282d37;
      --accent: #5b8cff;
      --accent-hi: #7aa2ff;
      --accent-soft: #1b2436;
      --ok: #4ade80;
      --ok-soft: #14261c;
      --err: #f87171;
      --err-soft: #2a1618;
      --warn: #fbbf24;
      --warn-soft: #2a2113;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
      --shadow-lg: 0 2px 4px rgba(0,0,0,.35), 0 24px 48px -20px rgba(0,0,0,.75);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --surface: #171a20; --surface-2: #1e222a; --text: #e9ecf1;
    --muted: #9ba3b2; --faint: #6f7787; --line: #282d37; --accent: #5b8cff;
    --accent-hi: #7aa2ff; --accent-soft: #1b2436; --ok: #4ade80; --ok-soft: #14261c;
    --err: #f87171; --err-soft: #2a1618; --warn: #fbbf24; --warn-soft: #2a2113;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg: 0 2px 4px rgba(0,0,0,.35), 0 24px 48px -20px rgba(0,0,0,.75);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 0 20px 80px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 760px; margin: 0 auto; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 26px 0 22px;
  }
  .mark {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: linear-gradient(150deg, var(--accent), #8b5cf6);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 4px 12px -4px var(--accent);
  }
  .mark svg { width: 18px; height: 18px; }
  .brand { flex: 1; min-width: 0; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; font-weight: 650; }
  .brand p { margin: 1px 0 0; font-size: 12.5px; color: var(--faint); }
  .icon-btn {
    width: 34px; height: 34px; flex: none; display: grid; place-items: center;
    border-radius: var(--r-sm); border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--faint); }
  .icon-btn svg { width: 17px; height: 17px; }

  /* ---------- composer ---------- */
  .composer {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow);
    overflow: hidden; transition: border-color .18s, box-shadow .18s;
  }
  .composer.dragover { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .composer-main { padding: 6px 6px 0; }
  .url-wrap { position: relative; }
  textarea#urls {
    width: 100%; border: none; background: none; color: var(--text);
    padding: 14px 14px 8px; resize: none; font: inherit; font-size: 15px;
    min-height: 52px; max-height: 190px; overflow-y: auto;
  }
  textarea#urls:focus { outline: none; }
  textarea#urls::placeholder { color: var(--faint); }

  /* preview strip */
  .preview {
    display: flex; gap: 12px; align-items: center; margin: 2px 8px 0;
    padding: 9px; border-radius: var(--r-sm); background: var(--surface-2);
    animation: rise .22s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .preview img {
    width: 68px; height: 40px; object-fit: cover; border-radius: 5px;
    flex: none; background: var(--line);
  }
  .preview .pv-text { min-width: 0; flex: 1; }
  .preview .pv-title {
    font-size: 13.5px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .preview .pv-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .spinner {
    width: 15px; height: 15px; border-radius: 50%; flex: none;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* segmented control */
  .seg {
    display: inline-flex; background: var(--surface-2); border-radius: var(--r-sm);
    padding: 3px; gap: 2px; border: 1px solid var(--line);
  }
  .seg button {
    border: none; background: none; color: var(--muted); cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 550; padding: 6px 13px;
    border-radius: 6px; display: flex; align-items: center; gap: 6px;
    transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-selected="true"] {
    background: var(--surface); color: var(--text); box-shadow: var(--shadow);
  }
  .seg svg { width: 14px; height: 14px; }

  .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px 12px;
  }
  .grow { flex: 1; }

  select, input[type=text] {
    font: inherit; font-size: 13.5px; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 8px 10px;
  }
  select:focus, input[type=text]:focus, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  .btn {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 9px 18px; border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    display: inline-flex; align-items: center; gap: 7px;
    transition: background .15s, border-color .15s, transform .08s;
  }
  .btn:hover:not(:disabled) { border-color: var(--faint); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 4px 12px -5px var(--accent);
  }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hi); border-color: var(--accent-hi); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn svg { width: 15px; height: 15px; }
  .btn.ghost { border-color: transparent; background: none; color: var(--muted); font-weight: 500; }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  kbd {
    font: inherit; font-size: 11px; padding: 1px 5px; border-radius: 4px;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.22);
  }

  /* advanced disclosure */
  details.adv { border-top: 1px solid var(--line); background: var(--surface-2); }
  details.adv > summary {
    list-style: none; cursor: pointer; padding: 10px 14px; font-size: 13px;
    color: var(--muted); display: flex; align-items: center; gap: 6px;
    user-select: none;
  }
  details.adv > summary::-webkit-details-marker { display: none; }
  details.adv > summary:hover { color: var(--text); }
  details.adv > summary .chev { transition: transform .2s; width: 13px; height: 13px; }
  details.adv[open] > summary .chev { transform: rotate(90deg); }
  .adv-body { padding: 2px 14px 16px; display: grid; gap: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .field-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field-row > .field { flex: 1 1 190px; min-width: 0; }
  .field input[type=text], .field select { width: 100%; }
  .path-row { display: flex; gap: 8px; }
  .path-row input { flex: 1; min-width: 0; font-size: 12.5px; }
  .toggles { display: flex; gap: 8px; flex-wrap: wrap; }
  .toggle {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-size: 13px; padding: 7px 12px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--surface);
    transition: border-color .15s, background .15s, color .15s;
  }
  .toggle:hover { border-color: var(--faint); }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle:has(input:checked) {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent-hi);
    font-weight: 550;
  }
  .toggle:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggle .dot {
    width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--faint);
    display: grid; place-items: center; flex: none; transition: background .15s, border-color .15s;
  }
  .toggle:has(input:checked) .dot { background: var(--accent); border-color: var(--accent); }
  .toggle .dot svg { width: 9px; height: 9px; color: #fff; opacity: 0; }
  .toggle:has(input:checked) .dot svg { opacity: 1; }

  /* ---------- jobs ---------- */
  .section-head {
    display: flex; align-items: center; gap: 10px;
    margin: 30px 2px 12px;
  }
  .section-head h2 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 650;
    letter-spacing: .03em; text-transform: uppercase; }
  .count {
    font-size: 11.5px; color: var(--muted); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 20px; padding: 1px 8px;
  }

  .job {
    display: flex; gap: 13px; padding: 13px; margin-bottom: 9px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow);
    animation: rise .22s ease-out;
  }
  .thumb {
    width: 78px; height: 46px; border-radius: 7px; flex: none;
    object-fit: cover; background: var(--surface-2);
  }
  .thumb.ph { display: grid; place-items: center; color: var(--faint); }
  .thumb.ph svg { width: 18px; height: 18px; }
  .job-body { flex: 1; min-width: 0; }
  .job-head { display: flex; gap: 10px; align-items: flex-start; }
  .job-title {
    flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px;
    flex: none; text-transform: capitalize; display: flex; align-items: center; gap: 5px;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
  }
  .badge.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .badge.error { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .badge.cancelled { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .badge.running, .badge.queued { background: var(--accent-soft); color: var(--accent-hi); border-color: transparent; }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .bar { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 9px; }
  .bar > i {
    display: block; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), #8b5cf6);
    transition: width .3s ease;
  }
  .bar.indet > i {
    width: 35% !important; animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .job-meta {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    font-size: 12px; color: var(--muted); margin-top: 8px;
  }
  .job-meta .sep { color: var(--line); }
  .job-meta .err { color: var(--err); }
  .job-meta .file {
    font-family: ui-monospace, Consolas, monospace; font-size: 11.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  .mini {
    border: none; background: none; color: var(--accent); cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 550; padding: 2px 4px; border-radius: 5px;
  }
  .mini:hover { background: var(--accent-soft); }
  .mini.danger { color: var(--err); }
  .mini.danger:hover { background: var(--err-soft); }

  .empty {
    text-align: center; padding: 40px 20px; color: var(--faint);
    border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface);
  }
  .empty svg { width: 30px; height: 30px; margin-bottom: 10px; opacity: .55; }
  .empty p { margin: 0; font-size: 13.5px; }

  /* ---------- formats sheet ---------- */
  dialog {
    border: none; padding: 0; border-radius: var(--r); background: var(--surface);
    color: var(--text); box-shadow: var(--shadow-lg); max-width: 720px; width: calc(100% - 40px);
    max-height: 78vh;
  }
  dialog::backdrop { background: rgba(10,12,16,.5); backdrop-filter: blur(3px); }
  .sheet-head {
    display: flex; align-items: center; gap: 10px; padding: 15px 18px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface);
  }
  .sheet-head h3 { margin: 0; font-size: 14.5px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-body { overflow: auto; max-height: calc(78vh - 56px); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 10px; white-space: nowrap; }
  thead th {
    color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; position: sticky; top: 0; background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  tbody tr { border-bottom: 1px solid var(--line); }
  tbody tr:hover { background: var(--surface-2); }
  td.dim { color: var(--faint); }

  /* ---------- toasts ---------- */
  #toasts {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column-reverse; gap: 8px; z-index: 50;
    width: max-content; max-width: calc(100% - 40px);
  }
  .toast {
    display: flex; align-items: center; gap: 9px; padding: 10px 15px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: var(--shadow-lg); font-size: 13.5px;
    animation: pop .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } }
  .toast.err { border-color: var(--err); color: var(--err); }
  .toast.ok .ico { color: var(--ok); }
  .toast svg { width: 15px; height: 15px; flex: none; }

  @media (max-width: 560px) {
    .controls { gap: 8px; }
    .btn { padding: 9px 14px; }
    .thumb { width: 58px; height: 34px; }
    kbd { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 12 5 5 5-5"/><path d="M4 21h16"/>
      </svg>
    </div>
    <div class="brand">
      <h1>Video Downloader</h1>
      <p>Running locally &middot; for personal use</p>
    </div>
    <button class="icon-btn" id="recapLink" title="Recap Studio" aria-label="Recap Studio"
            onclick="location.href='/recap'" style="width:auto;padding:0 14px;gap:7px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px">
        <path d="m22 8-6 4 6 4V8z"/><rect x="2" y="6" width="14" height="12" rx="2"/>
      </svg>
      <span style="font-size:13px;font-weight:600">Recap Studio</span>
    </button>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </header>

  <section class="composer" id="composer">
    <div class="composer-main">
      <textarea id="urls" rows="1" spellcheck="false"
        placeholder="Paste a video link&#10;&#10;Add more on separate lines to download a batch"></textarea>
      <div id="preview"></div>
    </div>

    <div class="controls">
      <div class="seg" role="tablist" aria-label="Download mode">
        <button role="tab" id="mode-video" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="14" height="14" rx="2.5"/><path d="m16 11 6-3.5v9L16 13"/>
          </svg>Video
        </button>
        <button role="tab" id="mode-audio" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>
          </svg>MP3
        </button>
      </div>

      <select id="quality" aria-label="Maximum quality">
        <option value="480">480p</option>
        <option value="720">720p</option>
        <option value="1080" selected>1080p</option>
        <option value="1440">1440p</option>
        <option value="2160">4K</option>
        <option value="best">Best</option>
      </select>

      <span class="grow"></span>

      <button class="btn ghost" id="check" title="See what qualities exist, without downloading">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>Formats
      </button>
      <button class="btn primary" id="go">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="m7 12 5 5 5-5"/><path d="M4 21h16"/>
        </svg>Download <kbd>Ctrl &crarr;</kbd>
      </button>
    </div>

    <details class="adv">
      <summary>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        Options
      </summary>
      <div class="adv-body">
        <div class="toggles">
          <label class="toggle"><input type="checkbox" id="subs">
            <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg></span>
            Embed subtitles</label>
          <label class="toggle"><input type="checkbox" id="playlist">
            <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg></span>
            Whole playlist</label>
          <label class="toggle"><input type="checkbox" id="keep">
            <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg></span>
            Keep originals</label>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="cookies">Browser cookies</label>
            <select id="cookies">
              <option value="">None</option>
              <option value="edge">Edge</option>
              <option value="chrome">Chrome</option>
              <option value="firefox">Firefox</option>
              <option value="brave">Brave</option>
            </select>
          </div>
          <div class="field">
            <label for="out">Save to</label>
            <div class="path-row">
              <input type="text" id="out" placeholder="loading…" spellcheck="false">
              <button class="btn" id="reveal" title="Open this folder" style="padding:8px 11px">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </details>
  </section>

  <div class="section-head">
    <h2>Downloads</h2>
    <span class="count" id="count" hidden></span>
    <span class="grow"></span>
    <button class="btn ghost" id="clear" hidden style="font-size:12.5px;padding:5px 10px">Clear finished</button>
  </div>
  <div id="jobs"></div>
</main>

<dialog id="sheet">
  <div class="sheet-head">
    <h3 id="sheet-title">Available formats</h3>
    <button class="icon-btn" id="sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body"><table id="formats"></table></div>
</dialog>

<div id="toasts"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const jobs = new Map();

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fmtSize(b) {
  if (!b) return "";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i ? b.toFixed(1) : b) + " " + u[i];
}

function fmtDur(sec) {
  if (!sec) return "";
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`
           : `${m}:${String(s).padStart(2, "0")}`;
}

const ICONS = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg>',
  err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>',
  film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 12h18"/></svg>',
  tray: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h4l1.5 3h7L17 14h4"/><path d="M4 14 6 5h12l2 9v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>',
};

let toastTimer;
function toast(text, kind = "ok") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = `<span class="ico">${kind === "err" ? ICONS.err : ICONS.ok}</span><span>${esc(text)}</span>`;
  $("toasts").append(el);
  clearTimeout(toastTimer);
  setTimeout(() => el.remove(), kind === "err" ? 6000 : 3200);
}

/* ---------- theme ---------- */
const savedTheme = localStorage.getItem("ytdl-theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("ytdl-theme", next);
};

/* ---------- composer ---------- */
const ta = $("urls");
function autosize() {
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 190) + "px";
}
ta.addEventListener("input", () => { autosize(); schedulePreview(); });

// Drag a link onto the card to fill it in.
const composer = $("composer");
["dragenter", "dragover"].forEach(e => composer.addEventListener(e, ev => {
  ev.preventDefault(); composer.classList.add("dragover");
}));
["dragleave", "drop"].forEach(e => composer.addEventListener(e, ev => {
  if (e === "dragleave" && composer.contains(ev.relatedTarget)) return;
  composer.classList.remove("dragover");
}));
composer.addEventListener("drop", ev => {
  ev.preventDefault();
  const text = ev.dataTransfer.getData("text/uri-list") || ev.dataTransfer.getData("text/plain");
  if (!text) return;
  ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + text.trim();
  autosize(); schedulePreview(); ta.focus();
});

/* mode segmented control */
let audioMode = false;
function setMode(audio) {
  audioMode = audio;
  $("mode-video").setAttribute("aria-selected", String(!audio));
  $("mode-audio").setAttribute("aria-selected", String(audio));
  // Quality and subtitles are meaningless for an mp3 rip.
  $("quality").disabled = audio;
  $("quality").style.opacity = audio ? ".45" : "";
  const subs = $("subs");
  subs.disabled = audio;
  subs.closest(".toggle").style.opacity = audio ? ".45" : "";
  if (audio) subs.checked = false;
}
$("mode-video").onclick = () => setMode(false);
$("mode-audio").onclick = () => setMode(true);

/* ---------- live preview of the first URL ---------- */
let previewTimer, previewSeq = 0;
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(runPreview, 550);
}

async function runPreview() {
  const url = (ta.value.split("\n").map(s => s.trim()).filter(Boolean))[0] || "";
  const box = $("preview");
  if (!/^https?:\/\/\S+$/.test(url)) { box.innerHTML = ""; return; }

  const seq = ++previewSeq;
  box.innerHTML = `<div class="preview"><div class="spinner"></div>
    <div class="pv-text"><div class="pv-sub">Looking up…</div></div></div>`;
  try {
    const q = new URLSearchParams({ url, cookies_browser: $("cookies").value });
    const r = await fetch("/api/info?" + q);
    if (seq !== previewSeq) return;           // a newer keystroke won
    if (!r.ok) throw new Error();
    const d = await r.json();
    const extra = [
      d.uploader,
      d.is_playlist ? `Playlist · ${d.count || "?"} videos` : fmtDur(d.duration),
    ].filter(Boolean).join(" · ");
    box.innerHTML = `<div class="preview">
      ${d.thumbnail ? `<img src="${esc(d.thumbnail)}" alt="" onerror="this.remove()">` : ""}
      <div class="pv-text">
        <div class="pv-title">${esc(d.title || url)}</div>
        <div class="pv-sub">${esc(extra)}</div>
      </div></div>`;
    // A playlist link almost always means you want the playlist.
    if (d.is_playlist && !$("playlist").checked) {
      $("playlist").checked = true;
      toast("Playlist detected — downloading all " + (d.count || "") + " videos");
    }
  } catch {
    if (seq === previewSeq) box.innerHTML = "";
  }
}

/* ---------- job list ---------- */
function render() {
  const list = [...jobs.values()].sort((a, b) => b.created - a.created);
  const box = $("jobs");
  const active = list.filter(j => j.status === "running" || j.status === "queued").length;
  const finished = list.length - active;

  $("count").hidden = !list.length;
  $("count").textContent = active ? `${active} active` : `${list.length} total`;
  $("clear").hidden = !finished;

  if (!list.length) {
    box.innerHTML = `<div class="empty">${ICONS.tray}<p>Nothing downloaded yet.</p></div>`;
    return;
  }

  box.innerHTML = list.map(j => {
    const live = j.status === "running" || j.status === "queued";
    const pct = j.percent;
    const bits = [];
    if (live) {
      bits.push(j.stage === "downloading" && pct
        ? `<strong>${pct.toFixed(0)}%</strong>`
        : esc(j.stage || "starting…"));
      if (j.speed) bits.push(esc(j.speed));
      if (j.eta) bits.push("ETA " + esc(j.eta));
    }
    if (j.duration && !live) bits.push(fmtDur(j.duration));
    if (j.error) bits.push(`<span class="err">${esc(j.error)}</span>`);
    if (j.status === "done" && j.files.length) {
      bits.push(`<span class="file">${esc(j.files[j.files.length - 1])}</span>`);
    }

    // A thumbnail that fails to load falls back to the placeholder tile
    // rather than leaving a broken-image box in the row.
    const thumb = j.thumbnail
      ? `<img class="thumb" src="${esc(j.thumbnail)}" alt=""
             onerror="this.outerHTML='<div class=&quot;thumb ph&quot;>${esc(ICONS.film)}</div>'">`
      : `<div class="thumb ph">${ICONS.film}</div>`;

    return `<div class="job">
      ${thumb}
      <div class="job-body">
        <div class="job-head">
          <div class="job-title" title="${esc(j.title)}">${esc(j.title)}</div>
          <span class="badge ${j.status}">${live ? '<span class="pulse"></span>' : ""}${j.status}</span>
        </div>
        ${live ? `<div class="bar${j.stage !== "downloading" || !pct ? " indet" : ""}">
                    <i style="width:${pct}%"></i></div>` : ""}
        <div class="job-meta">
          ${bits.join('<span class="sep">·</span>')}
          ${live ? `<button class="mini danger" data-cancel="${j.id}">Cancel</button>` : ""}
          ${j.status === "done" ? `<button class="mini" data-show="${esc(j.files[0] || "")}">Show in folder</button>` : ""}
        </div>
      </div>
    </div>`;
  }).join("");
}

$("jobs").addEventListener("click", async e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.dataset.cancel) {
    await fetch(`/api/jobs/${btn.dataset.cancel}/cancel`, { method: "POST" });
  } else if (btn.dataset.show !== undefined) {
    reveal(btn.dataset.show);
  }
});

$("clear").onclick = async () => {
  await fetch("/api/jobs/clear", { method: "POST" });
  for (const [id, j] of jobs) {
    if (j.status !== "running" && j.status !== "queued") jobs.delete(id);
  }
  render();
};

async function reveal(file) {
  try {
    const r = await fetch("/api/reveal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ folder: $("out").value, file: file || "" }),
    });
    if (!r.ok) throw new Error((await r.json()).detail);
  } catch (err) {
    toast(err.message || "Could not open the folder", "err");
  }
}
$("reveal").onclick = () => reveal("");

/* ---------- actions ---------- */
function payload() {
  return {
    urls: ta.value.split("\n").map(s => s.trim()).filter(Boolean),
    quality: $("quality").value,
    audio: audioMode,
    subs: $("subs").checked,
    playlist: $("playlist").checked,
    keep: $("keep").checked,
    cookies_browser: $("cookies").value,
    out: $("out").value.trim(),
  };
}

$("go").onclick = async () => {
  const body = payload();
  if (!body.urls.length) { toast("Paste a link first", "err"); ta.focus(); return; }
  $("go").disabled = true;
  try {
    const r = await fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Could not start");
    toast(body.urls.length > 1 ? `Started ${body.urls.length} downloads` : "Download started");
    ta.value = ""; autosize(); $("preview").innerHTML = "";
  } catch (err) {
    toast(err.message, "err");
  } finally {
    $("go").disabled = false;
  }
};

$("check").onclick = async () => {
  const body = payload();
  if (!body.urls.length) { toast("Paste a link first", "err"); ta.focus(); return; }
  $("check").disabled = true;
  try {
    const q = new URLSearchParams({ url: body.urls[0], cookies_browser: body.cookies_browser });
    const r = await fetch("/api/formats?" + q);
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Lookup failed");
    $("sheet-title").textContent = data.title || "Available formats";
    $("formats").innerHTML =
      `<thead><tr><th>ID</th><th>Ext</th><th>Resolution</th><th>FPS</th>
        <th>Size</th><th>Video</th><th>Audio</th><th>Note</th></tr></thead><tbody>` +
      data.formats.map(f => `<tr>
        <td>${esc(f.id)}</td><td>${esc(f.ext)}</td><td>${esc(f.resolution)}</td>
        <td class="dim">${esc(f.fps || "—")}</td><td>${fmtSize(f.filesize) || "—"}</td>
        <td class="dim">${esc(f.vcodec === "none" ? "—" : f.vcodec)}</td>
        <td class="dim">${esc(f.acodec === "none" ? "—" : f.acodec)}</td>
        <td class="dim">${esc(f.note)}</td></tr>`).join("") + "</tbody>";
    $("sheet").showModal();
  } catch (err) {
    toast(err.message, "err");
  } finally {
    $("check").disabled = false;
  }
};
$("sheet-close").onclick = () => $("sheet").close();

/* Ctrl/Cmd+Enter anywhere starts the download. */
addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("go").click(); }
});

/* ---------- boot ---------- */
fetch("/api/config").then(r => r.json()).then(c => {
  $("out").value = c.default_out;
  $("out").placeholder = c.default_out;
});

let lastStatus = new Map();
const es = new EventSource("/api/events");
es.onmessage = e => {
  const j = JSON.parse(e.data);
  // Announce the transition into a terminal state, once.
  const prev = lastStatus.get(j.id);
  if (prev && prev !== j.status) {
    if (j.status === "done") toast(`Finished: ${j.title}`);
    if (j.status === "error") toast(j.error || `Failed: ${j.title}`, "err");
  }
  lastStatus.set(j.id, j.status);
  jobs.set(j.id, j);
  render();
};

render();
ta.focus();
</script>
</body>
</html>
